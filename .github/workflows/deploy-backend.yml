# Installs or updates the backend on your server. Runs only when started by hand (Actions → Deploy backend → Run).
# Before the first run: create the server with deploy/server-setup.sh, then add
#   variable DEPLOY_HOST  = the server's IP address (or host name)
#   secret   DEPLOY_SSH_KEY = the private deploy key
# Database passwords and the token key stay in /opt/stocklist/.env on the server; they are never in GitHub.
name: Deploy backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
    steps:
      - name: Check configuration
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          [ -n "$DEPLOY_HOST" ] || { echo "::error::Add the repository variable DEPLOY_HOST (the server's IP address)."; exit 1; }
          [ "$HAS_KEY" = "true" ] || { echo "::error::Add the repository secret DEPLOY_SSH_KEY (the private deploy key)."; exit 1; }

      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Nothing is deployed unless every backend test passes.
      - name: Test and build the backend
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Prepare the files for the server
        run: |
          mkdir -p bundle
          cp backend/target/stock-list-backend-*.jar bundle/app.jar
          cp deploy/Dockerfile deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup.sh deploy/restore.sh deploy/create-admin.sh deploy/mail-test.sh deploy/check-gmail-token-access.sh deploy/install-gmail-token-script.sh deploy/.env.example bundle/
          # The forced command of the owner's restricted key: copied under a new name and put in place on the server
          # with one atomic rename (install-gmail-token-script.sh), so it is never half-written or non-executable.
          cp deploy/set-gmail-token.sh bundle/set-gmail-token.sh.new
          sed -i 's/\r$//' bundle/*.sh bundle/set-gmail-token.sh.new
          chmod 755 bundle/*.sh bundle/set-gmail-token.sh.new

      - name: Connect to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          # Pasting into the GitHub secret box can add Windows line endings or join the lines; rebuild the key file
          # in the exact OpenSSH layout so either way works.
          printf '%s' "$DEPLOY_SSH_KEY" | python3 -c '
          import re, sys
          t = sys.stdin.read().replace("\r", "")
          m = re.search(r"-----BEGIN OPENSSH PRIVATE KEY-----(.*?)-----END OPENSSH PRIVATE KEY-----", t, re.S)
          if not m:
              sys.exit("DEPLOY_SSH_KEY must contain the lines -----BEGIN OPENSSH PRIVATE KEY----- ... -----END OPENSSH PRIVATE KEY-----")
          body = re.sub(r"\s+", "", m.group(1))
          lines = [body[i:i + 70] for i in range(0, len(body), 70)]
          print("-----BEGIN OPENSSH PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END OPENSSH PRIVATE KEY-----")
          ' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! PUB=$(ssh-keygen -y -f ~/.ssh/deploy_key 2>&1); then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key ($PUB). Copy it again from the secrets file, BEGIN to END lines included."
            exit 1
          fi
          echo "Deploy key in use (public half): $PUB"
          if [ -n "$DEPLOY_HOST_KEY" ]; then
            echo "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -T 15 -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
            echo "Server key (add it as variable DEPLOY_HOST_KEY to pin it): $(cat ~/.ssh/known_hosts)"
          fi
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 $DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            'test -f /opt/stocklist/.env || { echo "Run deploy/server-setup.sh on the server first"; exit 1; }; docker --version'

      - name: Copy and start
        run: |
          scp -i ~/.ssh/deploy_key -o BatchMode=yes bundle/* bundle/.env.example "$DEPLOY_USER@$DEPLOY_HOST:/opt/stocklist/"
          $SSH 'set -e
            cd /opt/stocklist
            chmod 755 *.sh
            ./install-gmail-token-script.sh
            # .env is also changed by the Gmail token update (set-gmail-token.sh): every edit holds the same lock.
            exec 9>>.env.lock
            flock -w 120 9 || { echo "::error::.env is locked by a Gmail token update; run the deploy again in a few minutes"; exit 1; }
            # A free <ip>.sslip.io name follows the server if its public IP changed (e.g. an Elastic IP added later).
            if grep -q "^API_DOMAIN=.*\.sslip\.io$" .env; then
              IP=$(curl -fsS --max-time 10 https://api.ipify.org)
              [ -n "$IP" ] && sed -i "s/^API_DOMAIN=.*/API_DOMAIN=$(echo "$IP" | tr . -).sslip.io/" .env
            fi
            # Keys added in later versions are created on the server the first time they are needed (never in GitHub).
            grep -q "^SUPPLIER_JWT_SIGNING_KEY=." .env || { sed -i "/^SUPPLIER_JWT_SIGNING_KEY=/d" .env; echo "SUPPLIER_JWT_SIGNING_KEY=$(openssl rand -base64 48 | tr -d "\n")" >> .env; }
            grep -q "^ADMIN_TOTP_KEY=." .env || { sed -i "/^ADMIN_TOTP_KEY=/d" .env; echo "ADMIN_TOTP_KEY=$(openssl rand -base64 32 | tr -d "\n")" >> .env; }
            flock -u 9
            exec 9>&-
            # Back up the database before every update (skipped on the very first deploy).
            if [ -n "$(docker compose -f docker-compose.prod.yml ps -q mysql 2>/dev/null)" ]; then ./backup.sh; else echo "First deploy: nothing to back up yet"; fi
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f > /dev/null
            grep ^API_DOMAIN= .env | cut -d= -f2' | tee deploy-output.txt
          echo "API_DOMAIN=$(tail -n 1 deploy-output.txt)" >> "$GITHUB_ENV"

      - name: Wait until the API answers over HTTPS
        run: |
          URL="https://$API_DOMAIN/actuator/health"
          for i in $(seq 1 40); do
            if curl -fsS --max-time 10 "$URL" | grep -q '"UP"'; then echo "UP: $URL"; exit 0; fi
            sleep 10
          done
          echo "::error::$URL did not answer. Logs:"
          $SSH 'cd /opt/stocklist && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail 80 backend caddy'
          exit 1

      # The owner's restricted SSH key for Gmail token updates must still work with the scripts just installed. Runs
      # the forced command exactly as sshd does, with "check" only: no credentials are transferred, nothing changes.
      - name: Check the Gmail token update access
        run: $SSH '/opt/stocklist/check-gmail-token-access.sh'

      - name: Summary
        if: always()
        run: |
          {
            echo "## Backend deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Server | \`$DEPLOY_HOST\` |"
            echo "| App server address | ${API_DOMAIN:+https://$API_DOMAIN/} |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Date (UTC) | $(date -u '+%Y-%m-%d %H:%M') |"
            echo ""
            echo "Set this address as the repository variable **API_BASE_URL** (or keep DEPLOY_HOST set) so APKs use it."
          } >> "$GITHUB_STEP_SUMMARY"
