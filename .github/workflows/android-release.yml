# Builds the signed release APK (the one to install on everyone's phones). Started by hand (Actions → Android
# release APK → Run workflow) or by pushing a tag such as v1.0.1.
# Needs secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD, and the server address as variable
# API_BASE_URL (https://.../) or DEPLOY_HOST (IP of a server set up with deploy/server-setup.sh).
name: Android release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: android-release
  cancel-in-progress: false

# write: lets the job publish the APK on the repository's Releases page (it does not push code).
permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The JDK download from GitHub sometimes fails (rate limit, connection reset). Up to three tries, with a
      # pause between them; the job only fails if all three do.
      - name: Set up JDK 21 (JetBrains Runtime)
        id: jdk1
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          # Signed-in download of the JDK; without it GitHub's shared API rate limit can refuse the request.
          token: ${{ github.token }}
      - name: Wait before trying the JDK download again
        if: steps.jdk1.outcome == 'failure'
        run: sleep 30
      - name: Set up JDK 21 (JetBrains Runtime) (second try)
        id: jdk2
        if: steps.jdk1.outcome == 'failure'
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          # Signed-in download of the JDK; without it GitHub's shared API rate limit can refuse the request.
          token: ${{ github.token }}
      - name: Wait before the last JDK download try
        if: steps.jdk1.outcome == 'failure' && steps.jdk2.outcome == 'failure'
        run: sleep 60
      - name: Set up JDK 21 (JetBrains Runtime) (last try)
        if: steps.jdk1.outcome == 'failure' && steps.jdk2.outcome == 'failure'
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"
          # Signed-in download of the JDK; without it GitHub's shared API rate limit can refuse the request.
          token: ${{ github.token }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licences and install SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The key exists only in this temporary runner and is deleted at the end; it is never printed.
      - name: Signing key and server address
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VAR_URL: ${{ vars.API_BASE_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || {
            echo "::error::Add the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (see docs/RELEASE.md)."; exit 1; }
          URL="$VAR_URL"
          if [ -z "$URL" ] && echo "$DEPLOY_HOST" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            URL="https://$(echo "$DEPLOY_HOST" | tr . -).sslip.io/"
          fi
          case "$URL" in https://*/) ;; https://*) URL="$URL/";; *)
            echo "::error::Set the variable API_BASE_URL to your server (https://...) or DEPLOY_HOST to its IP."; exit 1;; esac
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          chmod +x gradlew
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=stocklist"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "api.baseUrl=$URL"
          } > keystore.properties
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      # versionCode grows with every release run, so phones accept each new APK as an update.
      - name: Build signed release APK
        run: ./gradlew --stacktrace assembleRelease -PappVersionCode=$((100 + GITHUB_RUN_NUMBER))

      - name: Verify signature and collect APK
        id: apk
        run: |
          DIR=app/build/outputs/apk/release
          APK=$(find "$DIR" -maxdepth 1 -name '*.apk' | head -n 1)
          [ -n "$APK" ] || { echo "::error::No release APK produced"; exit 1; }
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          grep -q "CN=Stock List Manager" signature.txt || { echo "::error::APK is not signed with the release key"; exit 1; }
          VN=$(jq -r '.elements[0].versionName' "$DIR/output-metadata.json")
          VC=$(jq -r '.elements[0].versionCode' "$DIR/output-metadata.json")
          NAME="Stock-List-Manager-${VN}-release-${VC}.apk"
          mkdir -p ../apk-out && cp "$APK" "../apk-out/$NAME"
          {
            echo "name=$NAME"; echo "vn=$VN"; echo "vc=$VC"
            echo "sha256=$(sha256sum "../apk-out/$NAME" | cut -d' ' -f1)"
            echo "cert=$(grep -m1 'SHA-256 digest' signature.txt | awk '{print $NF}')"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stock-List-Manager-release-APK
          path: ${{ steps.apk.outputs.file || 'apk-out/*.apk' }}
          if-no-files-found: error
          retention-days: 90

      # Puts the APK on the Releases page as a plain .apk link that opens straight on a phone (no zip, no sign-in,
      # because the repository is public). Stock-List-Manager.apk is the same file under a fixed name, so
      # https://github.com/<owner>/<repo>/releases/latest/download/Stock-List-Manager.apk always gives the newest build.
      - name: Publish on the Releases page
        id: release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
          VN: ${{ steps.apk.outputs.vn }}
          VC: ${{ steps.apk.outputs.vc }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v${VN}-build${VC}"; fi
          cp "apk-out/$NAME" apk-out/Stock-List-Manager.apk
          printf 'Stock List Manager %s (build %s)\n\nOn your phone, tap **%s** below and install it.\n\nAPK SHA-256: `%s`\n' \
            "$VN" "$VC" "$NAME" "$SHA256" > release-notes.md
          gh release create "$TAG" "apk-out/$NAME" apk-out/Stock-List-Manager.apk \
            --target "$GITHUB_SHA" --title "Stock List Manager $VN (build $VC)" --notes-file release-notes.md --latest
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Stock List Manager — signed release APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Version | ${{ steps.apk.outputs.vn || 'not built' }} (code ${{ steps.apk.outputs.vc || '-' }}) |"
            echo "| Server address | ${API_URL:-not set} |"
            echo "| APK | ${{ steps.apk.outputs.name || 'not produced' }} |"
            echo "| Download on a phone | ${{ steps.release.outputs.url || 'not published' }} |"
            echo "| APK SHA-256 | \`${{ steps.apk.outputs.sha256 || '-' }}\` |"
            echo "| Signing certificate SHA-256 | \`${{ steps.apk.outputs.cert || '-' }}\` |"
            echo "| Date (UTC) | $(date -u '+%Y-%m-%d %H:%M') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" keystore.properties
