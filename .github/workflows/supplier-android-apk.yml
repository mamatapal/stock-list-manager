# Supplier Management app (supplier-android/): unit tests (including the Hindi catalogue check), debug APK and the
# minified staging APK. Separate from the Stock List Manager app's workflow; it runs only for supplier changes.
name: Supplier Management APK

on:
  push:
    branches: [main]
    paths:
      - "supplier-android/**"
      - "backend/src/main/java/app/stocklist/supplieraccount/SupplierPortalError.java"
      - "backend/src/main/java/app/stocklist/network/NetworkError.java"
      - ".github/workflows/supplier-android-apk.yml"
  pull_request:
    paths:
      - "supplier-android/**"
      - "backend/src/main/java/app/stocklist/supplieraccount/SupplierPortalError.java"
      - "backend/src/main/java/app/stocklist/network/NetworkError.java"
      - ".github/workflows/supplier-android-apk.yml"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Server the debug APK talks to, e.g. https://api.yourshop.in/ (empty: repository variable API_BASE_URL, else the server in DEPLOY_HOST)"
        required: false

concurrency:
  group: supplier-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests, debug and staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: supplier-android
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The JDK download from GitHub sometimes fails (rate limit, connection reset): one retry after a pause.
      - name: Set up JDK 21 (JetBrains Runtime)
        id: jdk1
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
          token: ${{ github.token }}
      - name: Wait before trying the JDK download again
        if: steps.jdk1.outcome == 'failure'
        run: sleep 45
      - name: Set up JDK 21 (JetBrains Runtime) (second try)
        if: steps.jdk1.outcome == 'failure'
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: "21"
          token: ${{ github.token }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licences and install SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Debug builds read the server address from local.properties (never committed). Only an address is written here.
      - name: Choose the server address for the debug APK
        env:
          INPUT_URL: ${{ github.event.inputs.api_base_url }}
          VAR_URL: ${{ vars.API_BASE_URL }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          URL="${INPUT_URL:-$VAR_URL}"
          if [ -z "$URL" ] && echo "$DEPLOY_HOST" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
            URL="https://$(echo "$DEPLOY_HOST" | tr . -).sslip.io/"
          fi
          if [ -n "$URL" ]; then
            case "$URL" in */) ;; *) URL="$URL/";; esac
            echo "api.baseUrl=$URL" > local.properties
          else
            URL="http://10.0.2.2:8080/ (Android emulator on the developer PC)"
          fi
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      # Gradle does not print test counts: total them from the reports, and fail if any test was skipped
      # (the end-to-end tests skip themselves here, by design, and run in their own job below).
      - name: Show unit test results
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = {"tests": 0, "skipped": 0, "failures": 0, "errors": 0}
          skipped = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              s = ET.parse(f).getroot()
              n = {k: int(s.get(k, 0)) for k in total}
              for k in total: total[k] += n[k]
              print(f"{s.get('name')}: {n['tests']} tests, {n['skipped']} skipped, {n['failures']} failures, {n['errors']} errors")
              if n["skipped"] and "EndToEnd" not in s.get("name"): skipped.append(s.get("name"))
          print("TOTAL:", total)
          if total["tests"] == 0: raise SystemExit("no unit tests ran")
          if skipped: raise SystemExit(f"skipped tests in {skipped}")
          PY

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Build minified staging APK
        run: ./gradlew --stacktrace --max-workers=1 assembleStaging

      - name: Collect APKs
        id: apk
        run: |
          mkdir -p ../apk-out
          DATE=$(date -u +%Y-%m-%d)
          for v in debug staging; do
            APK=$(find app/build/outputs/apk/$v -maxdepth 1 -name '*.apk' | head -n 1)
            [ -n "$APK" ] || { echo "::error::No $v APK was produced"; exit 1; }
            cp "$APK" "../apk-out/Supplier-Management-$v-${DATE}-${GITHUB_SHA::7}.apk"
          done
          ls -l ../apk-out

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: Supplier-Management-APKs
          path: apk-out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          TESTS=0; FAILED=0
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            TESTS=$((TESTS + $(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9)))
            FAILED=$((FAILED + $(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc 0-9) + $(grep -o 'errors="[0-9]*"' "$f" | head -1 | tr -dc 0-9)))
          done
          {
            echo "## Supplier Management — debug and staging APK"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\` |"
            echo "| Unit tests | $TESTS run, $FAILED failed |"
            echo "| Server address in the debug APK | ${API_URL:-not set} |"
            echo ""
            echo "Download: **Artifacts → Supplier-Management-APKs** at the bottom of this page (kept 30 days)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: supplier-android-reports
          path: |
            supplier-android/app/build/reports/
            supplier-android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The app's network layer against the real backend: a throwaway MySQL 8.4 and a backend built from this commit,
  # both on the CI machine and deleted with it. Never production. The test supplier is registered and its email
  # verified through the real API; only the administrator's approval is written directly into this test database.
  end-to-end:
    name: End-to-end tests against a test backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e-root
          MYSQL_DATABASE: stocklist
          MYSQL_USER: stocklist
          MYSQL_PASSWORD: e2e-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pe2e-root"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      E2E_BASE_URL: http://127.0.0.1:8080/
      E2E_SUPPLIER_EMAIL: approved.supplier@example.com
      E2E_SUPPLIER_PASSWORD: Supplier-Pass-2026
      E2E_PENDING_EMAIL: pending.supplier@example.com
      E2E_PENDING_PASSWORD: Supplier-Pass-2026
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the backend (tests run in the backend workflow)
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests package
          cp target/*.jar ../backend-e2e.jar

      - name: Start the test backend
        run: |
          export DB_URL="jdbc:mysql://127.0.0.1:3306/stocklist?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          export DB_USER=stocklist DB_PASSWORD=e2e-password
          export JWT_SIGNING_KEY="$(openssl rand -base64 48)" SUPPLIER_JWT_SIGNING_KEY="$(openssl rand -base64 48)"
          export ADMIN_TOTP_KEY="$(openssl rand -base64 32)" MAIL_LOG_TOKENS=true PUBLIC_BASE_URL=http://127.0.0.1:8080
          nohup java -jar backend-e2e.jar > backend-e2e.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null; then echo "backend up"; exit 0; fi
            sleep 2
          done
          echo "::error::The test backend did not start"; tail -100 backend-e2e.log; exit 1

      - name: Create the test suppliers (register and verify through the API; approve one in the test database)
        run: |
          set -e
          register() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/supplier-portal/auth/register \
              -H 'Content-Type: application/json' -d "{\"legalName\":\"$2\",\"tradeName\":null,\"contactPerson\":\"Ravi Sharma\",
                \"mobile\":\"9876543210\",\"email\":\"$1\",\"password\":\"Supplier-Pass-2026\",\"address\":\"MG Road\",
                \"city\":\"Indore\",\"state\":\"Madhya Pradesh\",\"pinCode\":\"452001\",\"gstin\":null}")
            [ "$code" = "202" ] || { echo "::error::register $1 answered $code"; exit 1; }
            sleep 1
            token=$(grep -o 'verify-email.html#t=[^ ]*' backend-e2e.log | tail -1 | sed 's/.*#t=//')
            [ -n "$token" ] || { echo "::error::no verification link logged"; exit 1; }
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/supplier-portal/auth/verify-email \
              -H 'Content-Type: application/json' -d "{\"token\":\"$token\"}")
            [ "$code" = "200" ] || { echo "::error::verify $1 answered $code"; exit 1; }
          }
          register "$E2E_SUPPLIER_EMAIL" "Sharma Wholesale Traders"
          register "$E2E_PENDING_EMAIL" "Pending Supply Company"
          docker exec ${{ job.services.mysql.id }} mysql -ustocklist -pe2e-password stocklist -e \
            "UPDATE supplier_org SET status='APPROVED', reviewed_at=NOW(6) WHERE email='$E2E_SUPPLIER_EMAIL';
             SELECT email, status FROM supplier_org;"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licences and install SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v5

      - name: Run the end-to-end tests
        working-directory: supplier-android
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace testDebugUnitTest --tests '*SupplierNetworkEndToEndTest*'
          for f in app/build/test-results/testDebugUnitTest/*EndToEnd*.xml; do
            grep -q 'skipped="0"' "$f" || { echo "::error::end-to-end tests were skipped"; exit 1; }
            grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f"
          done

      - name: Upload backend log and test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: supplier-android-e2e-reports
          path: |
            backend-e2e.log
            supplier-android/app/build/reports/
            supplier-android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
