# Production: MySQL 8.4 + backend + Caddy (automatic HTTPS with Let's Encrypt).
# Secrets come from .env (copy .env.example). Only Caddy is reachable from the internet.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stocklist
      MYSQL_USER: stocklist
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      TZ: UTC
    # Sized for a 2 GB server: the whole database of a few shops fits in 256 MB of cache.
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci",
              "--innodb-buffer-pool-size=256M", "--max-connections=60", "--performance-schema=OFF"]
    mem_limit: 700m
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  backend:
    build: .
    image: stock-list-backend:${APP_VERSION:-1.0.0}
    # The JVM takes 75% of this limit for its heap (see Dockerfile).
    mem_limit: 900m
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/stocklist?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: stocklist
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      JWT_KEY_ID: ${JWT_KEY_ID:-k1}
      # Supplier Management app and Supplier Administration portal (Phase S1)
      SUPPLIER_JWT_SIGNING_KEY: ${SUPPLIER_JWT_SIGNING_KEY:?set SUPPLIER_JWT_SIGNING_KEY in .env}
      ADMIN_TOTP_KEY: ${ADMIN_TOTP_KEY:?set ADMIN_TOTP_KEY in .env}
      PUBLIC_BASE_URL: https://${API_DOMAIN}
      APP_BUSINESS_ZONE: ${APP_BUSINESS_ZONE:-Asia/Kolkata}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SWAGGER_ENABLED: "false"
      MAIL_LOG_TOKENS: "false"
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  internal:
