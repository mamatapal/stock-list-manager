<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>नया पासवर्ड / New password - Supplier Management</title>
<link rel="stylesheet" href="supplier.css">
</head>
<body data-page="reset">
<main class="card">
  <h1>Supplier Management</h1>
  <h2><span lang="hi">नया पासवर्ड रखें</span><br><span lang="en">Choose a new password</span></h2>
  <form id="form">
    <label><span lang="hi">नया पासवर्ड (कम से कम 8 अक्षर)</span> / <span lang="en">New password (at least 8 characters)</span>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    <label><span lang="hi">पासवर्ड दोबारा लिखें</span> / <span lang="en">Type the password again</span>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    <button id="go" type="submit" class="primary">पासवर्ड सेव करें / Save password</button>
  </form>
  <div id="result" class="result" role="status" hidden></div>
</main>
<script src="supplier.js"></script>
</body>
</html>
