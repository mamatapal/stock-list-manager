spring:
  application:
    name: stock-list-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: BINARY
  flyway:
    enabled: true
  # Owner password-reset emails. Leave SMTP_HOST empty to disable (codes are then only logged with MAIL_LOG_TOKENS=true).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  # Honour X-Forwarded-For from the reverse proxy in production
  forward-headers-strategy: native

app:
  jwt:
    # Base64 of at least 32 random bytes. Generate with: openssl rand -base64 48
    signing-key: ${JWT_SIGNING_KEY}
    key-id: ${JWT_KEY_ID:k1}
    access-ttl: 15m
    step-up-ttl: 5m
  refresh-ttl: 30d
  lockout:
    max-failures: 5
    duration: 15m
  login-rate-per-minute: 20
  reset-token-ttl: 30m
  # Only for local development: writes password-reset links to the log instead of emailing them.
  mail-log-tokens: ${MAIL_LOG_TOKENS:false}
  # Sender address of reset emails, e.g. "Stock List Manager <no-reply@yourshop.in>"
  mail-from: ${MAIL_FROM:}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
